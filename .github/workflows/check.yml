name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core and headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official Neovim 0.12.0
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=nvim-linux-x86_64 ;;
            Darwin-arm64) asset=nvim-macos-arm64 ;;
            Darwin-x86_64) asset=nvim-macos-x86_64 ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v0.12.0/$asset.tar.gz" \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset/bin" >> "$GITHUB_PATH"
      - name: Syntax and isolated tests
        # Fresh runners report unavailable optional plugin/parser checks as skips.
        # Tests never bootstrap plugins, invoke Git, or launch a desktop editor.
        run: python scripts/check.py

  windows-package:
    name: Windows core and installer (no desktop validation)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official Neovim 0.12.0 for syntax checks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nvim.zip'
          Invoke-WebRequest 'https://github.com/neovim/neovim/releases/download/v0.12.0/nvim-win64.zip' -OutFile $archive
          $destination = Join-Path $env:RUNNER_TEMP 'nvim'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Join-Path $destination 'nvim-win64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Syntax, isolated tests and PowerShell installation tests
        run: python scripts/check.py

  editor:
    name: Editor with plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Neovim 0.12.6, tree-sitter and ripgrep from their releases
        shell: bash
        # Neovim 0.12.0 does not answer --remote-expr when the terminal tests drive it through a
        # pseudo-terminal, so this job uses a later 0.12 release; the core jobs keep the 0.12.0 minimum.
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=nvim-linux-x86_64 parser=linux-x64 search=x86_64-unknown-linux-musl ;;
            Darwin-arm64) asset=nvim-macos-arm64 parser=macos-arm64 search=aarch64-apple-darwin ;;
            Darwin-x86_64) asset=nvim-macos-x86_64 parser=macos-x64 search=x86_64-apple-darwin ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v0.12.6/$asset.tar.gz" \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/tools"
          curl --fail --location --retry 3 \
            "https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-$parser.gz" \
            | gunzip > "$RUNNER_TEMP/tools/tree-sitter"
          chmod +x "$RUNNER_TEMP/tools/tree-sitter"
          curl --fail --location --retry 3 \
            "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-$search.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tools" --strip-components 1 "ripgrep-14.1.1-$search/rg"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Restore cached plugins and parsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/jvim
          key: jvim-data-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/lazy-lock.json', 'config/lua/jvim/config.lua') }}
      - name: Install the pinned plugins and parsers
        shell: bash
        run: |
          mkdir -p ~/.config ~/.local/share/nvim
          ln -sfn "$PWD/config" ~/.config/jvim
          NVIM_APPNAME=jvim nvim --headless "+Lazy! restore" +qa
          NVIM_APPNAME=jvim nvim --headless \
            "+lua require('nvim-treesitter').install(require('jvim.config').get().treesitter.parsers):wait(300000)" +qa
          # The integration tests read plugins from the developer's Neovim data folder.
          ln -sfn ~/.local/share/jvim/lazy ~/.local/share/nvim/lazy
          # Starting jvim must leave the pinned plugin versions as committed.
          git diff --exit-code config/lazy-lock.json
      - name: Tests with plugins, parsers and a terminal
        shell: bash
        # Linux has no clipboard tool here, so its two copy and paste tests report a skip.
        run: |
          if [ "$(uname -s)" = Linux ]; then xvfb-run -a python scripts/check.py; else python scripts/check.py; fi
