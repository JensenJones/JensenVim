name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core and headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official Neovim 0.12.0
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=nvim-linux-x86_64 ;;
            Darwin-arm64) asset=nvim-macos-arm64 ;;
            Darwin-x86_64) asset=nvim-macos-x86_64 ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v0.12.0/$asset.tar.gz" \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset/bin" >> "$GITHUB_PATH"
      - name: Syntax and isolated tests
        # Fresh runners report unavailable optional plugin/parser checks as skips.
        # Tests never bootstrap plugins, invoke Git, or launch a desktop editor.
        run: python scripts/check.py

  windows-package:
    name: Windows core and installer (no desktop validation)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official Neovim 0.12.0 for syntax checks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nvim.zip'
          Invoke-WebRequest 'https://github.com/neovim/neovim/releases/download/v0.12.0/nvim-win64.zip' -OutFile $archive
          $destination = Join-Path $env:RUNNER_TEMP 'nvim'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Join-Path $destination 'nvim-win64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Syntax, isolated tests and PowerShell installation tests
        run: python scripts/check.py
